<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reconocimiento de Voz</title>
</head>
<body>
    <h1>Prueba de Reconocimiento de Voz</h1>
    <button id="btn-iniciar">Iniciar Escucha</space>
    <button id="btn-detener">Detener</space>
    <p id="resultado"></p>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            alert("Tu navegador no soporta la API de reconocimiento de voz.");
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES'; // Configura el idioma a español
            recognition.continuous = true; // Sigue escuchando
            recognition.interimResults = true; // Muestra resultados parciales

            const btnIniciar = document.getElementById('btn-iniciar');
            const btnDetener = document.getElementById('btn-detener');
            const resultado = document.getElementById('resultado');

            btnIniciar.addEventListener('click', () => {
                recognition.start();
            });

            btnDetener.addEventListener('click', () => {
                recognition.stop();
            });

            recognition.onresult = (event) => {
                let texto = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    texto += event.results[i][0].transcript;
                }
                resultado.innerText = texto;
            };

            recognition.onerror = (event) => {
                console.error("Error de reconocimiento: ", event.error);
            };
        }
    </script>
</body>
</html>
