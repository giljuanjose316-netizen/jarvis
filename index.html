<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jarvis</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #080b12;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .jarvis {
      width: min(700px, 90%);
      text-align: center;
      padding: 40px;
      border: 1px solid #263247;
      border-radius: 20px;
      background: #101621;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .status {
      margin: 20px 0;
      font-size: 18px;
      color: #8fa3bd;
    }

    .orb {
      width: 120px;
      height: 120px;
      margin: 30px auto;
      border-radius: 50%;
      border: 3px solid #5c9cff;
      box-shadow: 0 0 25px rgba(92, 156, 255, 0.5);
      transition: 0.3s;
    }

    .orb.active {
      transform: scale(1.15);
      box-shadow:
        0 0 30px rgba(92, 156, 255, 0.8),
        0 0 70px rgba(92, 156, 255, 0.4);
    }

    .command {
      margin-top: 20px;
      padding: 15px;
      min-height: 50px;
      border-radius: 10px;
      background: #080b12;
      color: #b8c7dc;
    }

    button {
      margin-top: 25px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #5c9cff;
      color: white;
      font-size: 16px;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
  </style>
</head>

<body>

  <main class="jarvis">

    <h1>JARVIS</h1>

    <div id="status" class="status">
      Inicializando...
    </div>

    <div id="orb" class="orb"></div>

    <div id="command" class="command">
      Esperando activación...
    </div>

    <button id="startButton">
      Activar micrófono
    </button>

  </main>

  <!--
    Orden importante:
    1. commands.js
    2. voice.js
    3. jarvis.js
  -->




</body>
</html>
