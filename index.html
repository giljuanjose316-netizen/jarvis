```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: #00e5ff;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            padding: 40px;

            text-align: center;

            border: 1px solid #00e5ff;
            border-radius: 20px;

            box-shadow:
                0 0 20px rgba(0, 229, 255, 0.2),
                inset 0 0 20px rgba(0, 229, 255, 0.05);
        }

        h1 {
            margin: 0 0 35px 0;
            font-size: 52px;
            letter-spacing: 8px;
        }

        .panel {
            margin-bottom: 20px;
            padding: 18px;

            background: #101010;
            border: 1px solid #1b5963;
            border-radius: 12px;

            text-align: left;
        }

        .label {
            margin-bottom: 8px;
            font-size: 14px;
            color: #72f1ff;
        }

        #status,
        #command {
            min-height: 24px;
            color: #ffffff;
        }

        button {
            margin-top: 20px;
            padding: 15px 30px;

            background: #00e5ff;
            color: #000000;

            border: none;
            border-radius: 10px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>JARVIS</h1>

        <section class="panel">
            <div class="label">ESTADO DEL SISTEMA</div>
            <div id="status">Sistema listo</div>
        </section>

        <section class="panel">
            <div class="label">COMANDO</div>
            <div id="command">Comando: ninguno</div>
        </section>

        <button id="activateButton">
            Activar micrófono
        </button>

    </main>

    <script src="js/commands.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/jarvis.js"></script>

</body>
</html>
```
