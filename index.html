<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis</title>
</head>
<body>
  <h1>Jarvis</h1>
  <p>Asistente personal orientado a voz y desarrollo.</p>
  <p>Proyecto en construcción.</p>
  <script>
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    document.body.insertAdjacentHTML(
      "beforeend",
      "<p>Este navegador no admite reconocimiento de voz.</p>"
    );
  } else {
    const recognition = new SpeechRecognition();

    recognition.lang = "es-CO";
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = function (event) {
      const result = event.results[event.results.length - 1][0].transcript
        .trim()
        .toLowerCase();

      console.log("Escuchado:", result);

      if (result.includes("jarvis")) {
        document.body.insertAdjacentHTML(
          "beforeend",
          "<p id='jarvis-response'>¿Sí, señor?</p>"
        );

        // Voz de respuesta
        const speech = new SpeechSynthesisUtterance("¿Sí, señor?");
        speech.lang = "es-CO";
        window.speechSynthesis.speak(speech);
      }
    };

    recognition.onerror = function (event) {
      console.error("Error de reconocimiento:", event.error);
    };

    recognition.onend = function () {
      // Reinicia la escucha cuando termina el reconocimiento
      recognition.start();
    };

    // Solicita el permiso del micrófono al iniciar
    recognition.start();
  }
</script>
</body>
</html>
