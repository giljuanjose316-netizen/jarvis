```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: #00e5ff;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .jarvis-container {
            width: 90%;
            max-width: 700px;
            padding: 40px;
            text-align: center;

            border: 1px solid #00e5ff;
            border-radius: 20px;

            box-shadow: 0 0 30px rgba(0, 229, 255, 0.25);
        }

        h1 {
            margin-bottom: 35px;
            font-size: 48px;
            letter-spacing: 8px;
        }

        .info {
            margin: 20px 0;
            padding: 18px;

            background: #101010;
            border: 1px solid #164d55;
            border-radius: 10px;

            text-align: left;
        }

        .label {
            margin-bottom: 8px;
            font-size: 13px;
            color: #72f1ff;
        }

        #status,
        #command {
            color: white;
            min-height: 22px;
        }

        #activateButton {
            margin-top: 20px;
            padding: 15px 30px;

            border: none;
            border-radius: 10px;

            background: #00e5ff;
            color: #000;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        #activateButton:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="jarvis-container">

        <h1>JARVIS</h1>

        <div class="info">
            <div class="label">ESTADO</div>
            <div id="status">Sistema listo</div>
        </div>

        <div class="info">
            <div class="label">COMANDO</div>
            <div id="command">Comando: ninguno</div>
        </div>

        <button id="activateButton">
            Activar micrófono
        </button>

    </div>

    <script src="js/commands.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/jarvis.js"></script>

</body>
</html>
